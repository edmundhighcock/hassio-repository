<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #fafafa; color: #333; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } a { color: #8ab4f8; } }
  h1 { font-size: 1.4rem; font-weight: 600; }
  ul { list-style: none; padding: 0; }
  li { margin: 0 0 12px; font-size: 1.1rem; }
</style>
</head>
<body>
<h1>Sites</h1>
<ul id="sites"><li>Loading…</li></ul>
<script>
// Relative URLs only: Ingress serves this page under a per-session prefix.
fetch("__sites.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(entries => {
    const names = entries.filter(e => e.type === "directory" && /^[a-z0-9][a-z0-9_-]*$/.test(e.name))
                         .map(e => e.name).sort();
    if (names.length === 1) { location.replace(names[0] + "/"); return; }
    const ul = document.getElementById("sites");
    ul.textContent = "";
    if (!names.length) { ul.innerHTML = "<li>Nothing has been published yet.</li>"; return; }
    for (const n of names) {
      const a = document.createElement("a");
      a.href = n + "/";
      a.textContent = n.replace(/[-_]/g, " ").replace(/^./, c => c.toUpperCase());
      const li = document.createElement("li");
      li.appendChild(a);
      ul.appendChild(li);
    }
  })
  .catch(() => { document.getElementById("sites").innerHTML = "<li>Could not list the sites.</li>"; });
</script>
</body>
</html>
