# Included in every location (an add_header in a location replaces, rather
# than adds to, the server's). The CSP is what enforces "no outbound
# requests from the page": scripts, styles, data and images load only from
# this site, so a CDN reference fails loudly in testing instead of quietly
# needing the internet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
