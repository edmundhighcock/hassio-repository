worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    # Every request re-resolves sites/<name>/current, so a symlink swap is
    # picked up on the next request with no reload.
    open_file_cache off;
    disable_symlinks off;
    autoindex off;
    # Ingress serves us under a per-session path prefix, so every redirect
    # must stay relative.
    absolute_redirect off;

    # Pages and data are revalidated on every load; other assets use
    # browser defaults. An empty value sends no header.
    map $uri $site_cache_control {
        ~(\.html|\.json|/)$ "no-cache";
        default             "";
    }

    server {
        listen 8099 default_server;
        # Only the Supervisor's ingress gateway may connect.
        allow 172.30.32.2;
        deny all;

        root /config/sites;
        error_page 404 /__404;

        # Shared chart library baked into the image, at ../vendor/ from a
        # site's pages. The version is in the path, so it caches forever.
        location ^~ /vendor/ {
            limit_except GET { deny all; }
            root /srv;
            include /etc/nginx/site-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The front page: lists the sites, or opens the only one.
        location = / {
            limit_except GET { deny all; }
            root /srv;
            try_files /index.html =404;
            include /etc/nginx/site-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Site names for the front page (names only, never contents).
        location = /__sites.json {
            limit_except GET { deny all; }
            rewrite ^ /__sitesdir/ last;
        }
        location ^~ /__sitesdir/ {
            internal;
            alias /config/sites/;
            autoindex on;
            autoindex_format json;
            include /etc/nginx/site-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # /<name> -> <name>/ (relative, so it survives the ingress prefix).
        location ~ ^/(?<site>[a-z0-9][a-z0-9_-]*)$ {
            return 301 $site/;
        }

        # /<name>/<path> is served from sites/<name>/current/<path>. Only
        # `current` is reachable; releases/ is not served directly.
        location ~ ^/(?<site>[a-z0-9][a-z0-9_-]*)/(?<rest>.*)$ {
            limit_except GET { deny all; }
            try_files /$site/current/${rest}index.html /$site/current/$rest @unpublished;
            include /etc/nginx/site-headers.conf;
            add_header Cache-Control $site_cache_control always;
        }

        # A site's front page when `current` is absent or dangling: the
        # placeholder, never an empty or broken page. Anything else: 404.
        location @unpublished {
            if ($rest !~ "(^|/)$") { return 404; }
            root /srv;
            rewrite ^ /placeholder.html break;
            include /etc/nginx/site-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location = /__404 {
            internal;
            default_type text/plain;
            return 404 "not found\n";
        }

        location / {
            return 404;
        }
    }
}
