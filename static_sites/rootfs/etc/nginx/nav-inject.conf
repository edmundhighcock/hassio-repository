# Injects a small floating Back/Refresh/Home control into every HTML page
# before </body>, so site authors need do nothing. Included once at the
# server level so it is inherited by every location (sub_filter directives
# are inherited unless a location sets its own).
#
# sub_filter only ever sees the response nginx itself produced, in plain
# text: this config enables no gzip module and sets no `gzip on;`, so
# Content-Encoding is never set and Accept-Encoding cannot defeat the
# filter. sub_filter_types defaults to text/html anyway, so non-HTML
# responses (JSON, JS, the vendored chart library, images) are untouched.
sub_filter_once on;
sub_filter_types text/html;

# All markup below uses single-quoted HTML/CSS/JS attribute and string
# delimiters so the whole thing fits inside nginx's own double-quoted
# argument; everything is scoped by the `ha-nav-` prefix and the script is
# one IIFE with no global left behind, so it cannot collide with a site's
# own scripts. CSP compliance: inline <style>/<script> only (the add-on's
# CSP allows 'unsafe-inline' for both), no external requests, no <img src>
# (icons are inline SVG markup).
sub_filter '</body>' "<div id='ha-nav-bar' role='navigation' aria-label='Page navigation'><button type='button' id='ha-nav-back' aria-label='Back' title='Back'><svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M15 18l-6-6 6-6'/></svg></button><button type='button' id='ha-nav-refresh' aria-label='Refresh' title='Refresh'><svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M4 4v5h5M20 20v-5h-5M5.5 9a7 7 0 0 1 12-3.5M18.5 15a7 7 0 0 1-12 3.5'/></svg></button><button type='button' id='ha-nav-home' aria-label='Home' title='Home'><svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M3 11l9-8 9 8M5 10v10h14V10'/></svg></button></div><style>#ha-nav-bar{position:fixed;right:12px;bottom:12px;z-index:2147483647;display:flex;gap:4px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.15);border-radius:999px;padding:4px;box-shadow:0 1px 6px rgba(0,0,0,.25)}#ha-nav-bar button{width:44px;height:44px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;cursor:pointer;color:#1f2328;-webkit-tap-highlight-color:transparent}#ha-nav-bar button:hover,#ha-nav-bar button:focus-visible{background:rgba(0,0,0,.08)}#ha-nav-bar button:active{background:rgba(0,0,0,.14)}#ha-nav-bar button:disabled{opacity:.3;cursor:default}#ha-nav-bar button:disabled:hover{background:transparent}@media (prefers-color-scheme:dark){#ha-nav-bar{background:rgba(32,34,38,.92);border-color:rgba(255,255,255,.18)}#ha-nav-bar button{color:#e6edf3}#ha-nav-bar button:hover,#ha-nav-bar button:focus-visible{background:rgba(255,255,255,.12)}#ha-nav-bar button:active{background:rgba(255,255,255,.18)}}</style><script>(function(){var b=document.getElementById('ha-nav-back');var r=document.getElementById('ha-nav-refresh');var h=document.getElementById('ha-nav-home');if(!b||!r||!h)return;if(window.history.length<=1){b.disabled=true;}b.addEventListener('click',function(){window.history.back();});r.addEventListener('click',function(){window.location.reload();});h.addEventListener('click',function(){var p=window.location.pathname;var m=/^(.*\/api\/hassio_ingress\/[^\/]+\/)/.exec(p);window.location.href=m?m[1]:'/';});})();</script></body>";
