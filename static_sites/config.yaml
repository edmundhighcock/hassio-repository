name: "Static Sites"
description: "Household static sites (e.g. the finance analysis), served through Ingress only"
version: "0.2.0"
slug: "static_sites"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
# Reachable ONLY through Ingress, which is behind Home Assistant's own login.
# There is deliberately no `ports:` mapping: a host port would bypass it.
ingress: true
ingress_port: 8099
panel_title: "Sites"
panel_icon: "mdi:web"
# false so non-admin household users can open it. Every site therefore has
# the same audience: every Home Assistant user.
panel_admin: false
# Sites are published into /addon_configs/9547a9e0_static_sites/sites/<name>/
# (this container's /config/sites). See DOCS.md for the release convention.
map:
  - addon_config:rw
hassio_api: false
homeassistant_api: false
auth_api: false
