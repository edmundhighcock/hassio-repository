name: Edmund HH's  Home Assistant Repository
url: https://github.com/edmundhighcock/hassio-repository
maintainer: edmundhighcock@sourceforge.net
addons:
  taiga:
    name: "Taiga Project Manager"
    description: "Taiga Agile Project Management platform"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/taiga
  postgres:
    name: "PostgreSQL"
    description: "PostgreSQL database server"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/postgres
  rabbitmq:
    name: "RabbitMQ"
    description: "RabbitMQ message broker"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/rabbitmq
  beancount:
    name: "Fava/Beancount"
    description: "Personal accounting software based on double-entry bookkeeping"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/beancount
  fireflyiii-mcp:
    name: "FireflyIII MCP Server"
    description: "Model Context Protocol server for FireflyIII personal finance automation"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/fireflyiii-mcp
  static_sites:
    name: "Static Sites"
    description: "Household static sites, served through Ingress only"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/static_sites
  influxdb2:
    name: "InfluxDB 2"
    description: "InfluxDB 2.x OSS, tuned for a memory-tight Pi, for the HA core influxdb integration"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/influxdb2
  virtual_sensors:
    name: "Virtual Sensors"
    description: "Derived sensors computed from other HA entities, published via MQTT discovery"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/virtual_sensors
  netconsole_receiver:
    name: "Netconsole Receiver"
    description: "Receives Linux netconsole kernel logs over UDP, keeps rotated logs, publishes status and alerts via MQTT discovery"
    url: https://github.com/edmundhighcock/hassio-repository/tree/main/netconsole_receiver
