arch:
  - aarch64
  - amd64
description: >-
  Data importer for Firefly III (separate addon) — alexbelgium's add-on,
  rebuilt by Fin on a pinned upstream image with an account-scoped
  duplicate-detection patch and a built-in import mutex.
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/vchiq
  - /dev/video10
  - /dev/video11
  - /dev/video12
  - /dev/video13
  - /dev/video14
  - /dev/video15
  - /dev/video16
  - /dev/ttyUSB0
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
  - /dev/sdd
  - /dev/sde
  - /dev/sdf
  - /dev/sdg
  - /dev/nvme
  - /dev/nvme0
  - /dev/nvme0n1
  - /dev/nvme0n1p1
  - /dev/nvme0n1p2
  - /dev/nvme0n1p3
  - /dev/nvme1n1
  - /dev/nvme1n1p1
  - /dev/nvme1n1p2
  - /dev/nvme1n1p3
  - /dev/nvme2n1
  - /dev/nvme2n1p1
  - /dev/nvme2n1p2
  - /dev/nvme2n3p3
  - /dev/mmcblk
  - /dev/fuse
  - /dev/sda1
  - /dev/sdb1
  - /dev/sdc1
  - /dev/sdd1
  - /dev/sde1
  - /dev/sdf1
  - /dev/sdg1
  - /dev/sda2
  - /dev/sdb2
  - /dev/sdc2
  - /dev/sdd2
  - /dev/sde2
  - /dev/sdf2
  - /dev/sdg2
  - /dev/sda3
  - /dev/sdb3
  - /dev/sda4
  - /dev/sdb4
  - /dev/sda5
  - /dev/sda6
  - /dev/sda7
  - /dev/sda8
  - /dev/nvme0
  - /dev/nvme1
  - /dev/nvme2
environment:
  TRUSTED_PROXIES: "**"
init: false
map:
  - app_config:rw
  - homeassistant_config:rw
  - share:rw
  - ssl
name: Firefly III Data Importer (Fin)
options:
  env_vars: []
  CONFIG_LOCATION: /config
ports:
  8080/tcp: 3474
ports_description:
  8080/tcp: web interface
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  AUTO_IMPORT_SECRET: str?
  CAN_POST_AUTOIMPORT: bool?
  CAN_POST_FILES: bool?
  CONFIG_LOCATION: str
  FIREFLY_III_ACCESS_TOKEN: str
  FIREFLY_III_CLIENT_ID: str?
  FIREFLY_III_URL: str
  NORDIGEN_ID: str?
  NORDIGEN_KEY: str?
  SPECTRE_APP_ID: str?
  SPECTRE_SECRET: str?
  Updates: list(hourly|daily|weekly)?
  silent: bool?
slug: fireflyiii_data_importer_fin
udev: true
url: https://github.com/edmundhighcock/hassio-repository/tree/main/fireflyiii-data-importer
version: "2.3.5-fin1"
webui: "[PROTO:ssl]://[HOST]:[PORT:8080]"
