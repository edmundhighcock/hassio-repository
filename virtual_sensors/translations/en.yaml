configuration:
  modules:
    name: "Modules"
    description: >-
      Which virtual-sensor modules to run. See DOCS.md "Adding a module"
      for what each one publishes. `example_passthrough` is a trivial
      demonstration module, off by default - it republishes one input
      entity unchanged under a new name, to prove the module interface
      is genuinely reusable.
  log_level:
    name: "Log level"
    description: "How much detail to log."
  mqtt_host:
    name: "MQTT host (override)"
    description: >-
      Only needed if the Supervisor's services API fails to report the
      Mosquitto add-on's connection details (this has been observed to
      happen even while Mosquitto is running - see DOCS.md "MQTT
      credentials"). Leave blank to rely on the Supervisor.
  mqtt_port:
    name: "MQTT port (override)"
    description: "Used only together with mqtt_host above."
  mqtt_username:
    name: "MQTT username (override)"
    description: "Used only together with mqtt_host above."
  mqtt_password:
    name: "MQTT password (override)"
    description: "Used only together with mqtt_host above."
  go_memlimit_mib:
    name: "Go memory limit (MiB)"
    description: >-
      GOMEMLIMIT - the Go runtime's soft heap limit, in MiB. Default 24
      targets well under 30MB resident on a memory-tight Raspberry Pi -
      see DOCS.md "Memory".
  hwc_mode:
    name: "Hot-water controller mode"
    description: >-
      shadow (default) runs the whole controller but never moves the
      switch. live is the first of two keys: the controller acts only when
      input_boolean.hot_water_controller_armed is also on. Needs the
      hot_water_control module enabled. See DOCS.md "Hot-water controller".
  hwc_off_limit_since_reheat_end_h:
    name: "Tank clock (h)"
    description: >-
      OFF is allowed only while the last finished reheat ended at most
      this long ago. Default 14; never more than 16.
  hwc_evening_off_from:
    name: "Evening from (HH:MM)"
    description: >-
      An OFF starting at or after this local time needs a finished reheat
      earlier the same day. Default 18:00.
  hwc_evening_off_requires_finished_reheat_today:
    name: "Evening rule"
    description: "Switch for the evening rule above. Default on."
  hwc_stale_after_min:
    name: "Input stale after (min)"
    description: >-
      The residual counts as stale after this long with no update (held
      values count until then). Default 30.
  hwc_boost_no_start_timeout_min:
    name: "Boost: no-start timeout (min)"
    description: "A boost ends if no reheat starts within this time. Default 30."
  hwc_boost_max_h:
    name: "Boost: maximum (h)"
    description: "The cap on any boost. Default 2."
  hwc_backstop_probe_h:
    name: "Backstop probe (h of ON time)"
    description: "Probe after this much switch-ON time with no genuine heater start. Default 10."
  hwc_backstop_alert_h:
    name: "Backstop alert (h of ON time)"
    description: "Alert and hold ON after this much switch-ON time with no genuine start. Default 18."
  hwc_max_moves_day:
    name: "Maximum moves per 24 h"
    description: "Default 8."
  hwc_battery_floor_pct:
    name: "Battery floor (%)"
    description: "Below this the controller holds ON. Default 30."
  hwc_planner_max_block_min:
    name: "Planner: longest OFF period (min)"
    description: "An optimisation choice, not a safety limit. Default 180."
  hwc_min_saving_ore:
    name: "Planner: minimum saving (öre/kWh)"
    description: "Default 20."
  hwc_planner:
    name: "Hot water: planner"
    description: "greedy_v1 (default) or v2, the 24 h planner (one full heat in the cheapest night window, a midday top-up, OFF otherwise). While greedy_v1 runs, v2 is published in shadow on sensor.hot_water_controller_plan_v2."
  hwc_v2_night_from:
    name: "Planner v2: night band start"
    description: "Local HH:MM. Default 22:00."
  hwc_v2_night_to:
    name: "Planner v2: night band end"
    description: "Local HH:MM. Default 07:00."
  hwc_v2_midday_from:
    name: "Planner v2: midday band start"
    description: "Local HH:MM. Default 10:00."
  hwc_v2_midday_to:
    name: "Planner v2: midday band end"
    description: "Local HH:MM. Default 16:00."
  hwc_v2_topup:
    name: "Planner v2: midday top-up"
    description: "Default on."
  hwc_v2_full_default_min:
    name: "Planner v2: full-heat length before history (min)"
    description: "Default 150. Learned (p85, 90 min to 4 h) once 5 reheats are logged."
  hwc_v2_topup_default_min:
    name: "Planner v2: top-up length before history (min)"
    description: "Default 60. Learned (p50, 30 to 120 min) once 5 top-ups are logged."
  hwc_v2_early_end_min:
    name: "Planner v2: end a window early after (min)"
    description: "The heater has stayed off this long after a finished reheat. Default 10."
  hwc_v2_evening_topup:
    name: "Planner v2: evening top-up"
    description: "Optional short top-up after an evening draw-down. Default off."
  hwc_v2_evening_gap_h:
    name: "Planner v2: evening top-up needs the night window further than (h)"
    description: "Default 3."
  hwc_v2_evening_drop_c:
    name: "Planner v2: evening demand = tank sensor fall (C)"
    description: "Fall from the 6 h maximum that counts as evening demand. Default 3."
  hwc_v2_window_resets_clock:
    name: "Planner v2: a window with no call for heat restarts the tank clock"
    description: "Not approved yet. Default off. Only on strict evidence; see DOCS.md."
  ev_entity_prefix:
    name: "EV: charger entity prefix"
    description: "ev_control (shadow only). Default loaver."
  ev_departure:
    name: "EV: departure time"
    description: "Local HH:MM. Default 06:30."
  ev_need_kwh:
    name: "EV: energy need (kWh)"
    description: "Battery plus charging losses, assumed empty at plug-in. Default 44."
  ev_min_a:
    name: "EV: minimum charge current (A)"
    description: "Below this a slot is unusable. Default 6."
  ev_max_a:
    name: "EV: maximum charge current (A)"
    description: "The charger circuit. Default 16."
  ev_phase_budget_a:
    name: "EV: per-phase budget (A)"
    description: "Default 19."
  ev_house_base_a:
    name: "EV: house base load per phase (A)"
    description: "Default 3."
  ev_min_block_min:
    name: "EV: minimum block (min)"
    description: "Gaps shorter than this between planned slots are filled. Default 30."
  ev_heater_phase_a:
    name: "EV: immersion heater current per phase (A)"
    description: "On phases A and B while it draws. Default 7.5."
  ev_hp_phase_a:
    name: "EV: heat pump maximum current on phase C (A)"
    description: "Default 7.4."
  hp_model_u:
    name: "HP model: loss coefficient (1/h)"
    description: "Shadow only. PROVISIONAL until the house-model fit. Default 0.08."
  hp_model_boost_rate:
    name: "HP model: boost heating rate (C/h)"
    description: "At 5 C outdoor. PROVISIONAL. Default 0.9."
  hp_model_rate_slope:
    name: "HP model: rate change per C colder (C/h)"
    description: "PROVISIONAL. Default 0.03."
  hp_model_hold_frac:
    name: "HP model: hold as fraction of boost"
    description: "PROVISIONAL. Default 0.4."
  hp_model_gain:
    name: "HP model: internal gain (C/h)"
    description: "PROVISIONAL. Default 0.1."
  hp_model_bedroom_offset:
    name: "HP model: bedroom offset (C)"
    description: "Bedroom minus house mean. PROVISIONAL. Default -2.0."
  hp_p_hold_w:
    name: "HP: electrical power at hold (W)"
    description: "Default 700."
  hp_p_boost_w:
    name: "HP: electrical power at boost (W)"
    description: "Default 1700."
  hp_min_default:
    name: "HP: minimum temperature if helper missing (C)"
    description: "Default 19.0."
  hp_desired_default:
    name: "HP: desired temperature if helper missing (C)"
    description: "Default 20.5."
  hp_bedroom_cap:
    name: "HP: bedroom night cap (C)"
    description: "Default 23."
  hp_night_start:
    name: "HP: night start"
    description: "Local HH:MM. Default 22:00."
  hp_night_end:
    name: "HP: night end"
    description: "Local HH:MM. Default 07:00."
  hp_evening_start:
    name: "HP: evening window start"
    description: "Local HH:MM. Default 17:00."
  hp_evening_end:
    name: "HP: evening window end"
    description: "Local HH:MM. Default 21:00."
  hp_dyson_night_pct:
    name: "HP: Dyson cap at night (%)"
    description: "Default 100."
  hp_dyson_day_home_pct:
    name: "HP: Dyson cap 09:00-17:00 with someone home (%)"
    description: "Default 60."
  hp_dyson_evening_pct:
    name: "HP: Dyson cap in the evening (%)"
    description: "Default 50."
  hp_dyson_away_pct:
    name: "HP: Dyson cap with nobody home (%)"
    description: "Default 100."
  hp_lambda:
    name: "HP: comfort weight (kr per C^2 per slot)"
    description: "Pulls the mean to desired. Default 0.1."
  hp_evening_penalty_kr:
    name: "HP: evening running penalty (kr per slot)"
    description: "Default 3.0."
  hp_switch_penalty_kr:
    name: "HP: level change penalty (kr)"
    description: "Every IR command beeps. Default 0.3."
  hwc_price_adder_ore:
    name: "Price adder (öre/kWh)"
    description: "Transfer + energy tax + supplier fee, excl. VAT. Update each January. Default 55.1."
  hwc_test_moves_only:
    name: "Test moves only (R3)"
    description: >-
      Overrides the planner: no planned OFF. Only the test-move and
      test-probe buttons switch the heater, and only when LIVE.
  hwc_test_off_min:
    name: "Test OFF length (min)"
    description: "How long a test move holds OFF before switching ON. Default 10."
