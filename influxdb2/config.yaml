name: "InfluxDB 2"
description: "InfluxDB 2.x OSS, tuned for a memory-tight Pi, for the HA core influxdb integration"
version: "0.1.1"
slug: "influxdb2"
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
watchdog: "http://[HOST]:8086/health"
# Published on the LAN (default host port 8086) so a backup job on another
# LAN machine can pull `influx backup` over HTTP. Home Assistant Core and
# every other add-on can also reach it over the Supervisor's internal
# network, at http://9547a9e0-influxdb2:8086, regardless of this mapping.
# Edmund treats the LAN/tailnet as trusted - this must never be
# port-forwarded to the internet. Disable it from the add-on's Network
# tab if the backup job isn't needed. See DOCS.md.
ports:
  "8086/tcp": 8086
ports_description:
  "8086/tcp": "InfluxDB API - LAN-trusted only, never port-forward off the LAN"
options:
  organization: "household"
  bucket: "homeassistant"
  retention: ""
  admin_username: "admin"
  storage_cache_max_memory_size: 268435456
  storage_cache_snapshot_memory_size: 16777216
  storage_max_concurrent_compactions: 1
  query_concurrency: 2
  query_queue_size: 10
  query_initial_memory_bytes: 10485760
  query_memory_bytes: 209715200
  query_max_memory_bytes: 419430400
  go_memlimit_mib: 450
  metrics_enabled: false
  admin_token_generation: 0
schema:
  organization: "str"
  bucket: "str"
  retention: "str"
  admin_username: "str"
  storage_cache_max_memory_size: "int(1048576,)"
  storage_cache_snapshot_memory_size: "int(1048576,)"
  storage_max_concurrent_compactions: "int(1,)"
  query_concurrency: "int(0,)"
  query_queue_size: "int(0,)"
  query_initial_memory_bytes: "int(1048576,)"
  query_memory_bytes: "int(1048576,)"
  query_max_memory_bytes: "int(1048576,)"
  go_memlimit_mib: "int(64,)"
  metrics_enabled: "bool"
  admin_token_generation: "int(0,)"
# Own private data (bolt + engine, under /data) is excluded from Home
# Assistant's own backups: the off-site copy is pulled by a job on another
# LAN machine, over HTTP, against the published port above. See DOCS.md.
backup: hot
backup_exclude:
  - "**"
hassio_api: false
homeassistant_api: false
auth_api: false
ingress: false
